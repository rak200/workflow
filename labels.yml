# Canonical labels, applied ADDITIVELY to every repository — the sync never deletes.
# Labels outside this set belong to automations (Dependabot's `dependencies` and
# `github_actions`, release-please's `autorelease:*`) and deleting them breaks releases.
#
# Renames go through `aliases`, which preserves the association of existing issues.
#
# There are no PR type labels. A pull request's type is its title, which CI enforces and
# release-please reads, and which the squash merge turns into the trunk's own type index.
# A label would be a third home for that fact, kept in step by a mechanism that has to be
# built, permissioned and carried. rak200/workflow#60

# --- issue and triage: applied by the templates or by triage ---
# `bug` / `feature` come from the templates; the rest are triage. `docs` and `test` are
# here because the first two do not cover them, which is why seven issues had reached for
# `type: docs` and `type: test` instead. They are flat, like the rest: the prefix existed
# to keep `bug` (an issue) apart from `fix` (a PR), and there are no PR labels to confuse
# them with any more.
- name: "bug"
  color: "d73a4a"
  description: "Something behaves incorrectly"
- name: "feature"
  color: "0e8a16"
  description: "A capability that does not exist yet"
  aliases: ["enhancement"]
- name: "docs"
  color: "0075ca"
  description: "Documentation is wrong, missing or misleading"
  aliases: ["type: docs"]
- name: "test"
  color: "bfd4f2"
  description: "The suite is wrong, missing or asserts nothing"
  aliases: ["type: test"]
- name: "needs-triage"
  color: "fbca04"
  description: "Not yet assessed"
- name: "blocked"
  color: "000000"
  description: "Waiting on something outside this repository"
- name: "duplicate"
  color: "cfd3d7"
  description: "Already reported elsewhere"
- name: "wontfix"
  color: "ffffff"
  description: "Deliberately not pursued"
- name: "security"
  color: "b60205"
  description: "Security-relevant"
