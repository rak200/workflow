# Canonical labels, applied ADDITIVELY to every repository — the sync never deletes.
# Labels outside this set belong to automations (Dependabot's `dependencies` and
# `github_actions`, release-please's `autorelease:*`) and deleting them breaks releases.
#
# Renames go through `aliases`, which preserves the association of existing issues.
#
# PR type labels are DERIVED from the enforced PR title, never applied by hand: a
# hand-applied one would be a second source of truth beside what the release tooling reads.

# --- type: one per commit type, PR-only, machine-applied ---
- name: "type: feat"
  color: "0e8a16"
  description: "A new capability"
- name: "type: fix"
  color: "d73a4a"
  description: "A bug fix"
- name: "type: perf"
  color: "1d76db"
  description: "A performance change, no API change"
- name: "type: revert"
  color: "b60205"
  description: "Reverts a prior commit"
- name: "type: refactor"
  color: "5319e7"
  description: "Internal change, no behaviour change"
- name: "type: style"
  color: "c5def5"
  description: "Formatting only, no meaning change"
- name: "type: docs"
  color: "0075ca"
  description: "Documentation only"
- name: "type: test"
  color: "bfd4f2"
  description: "Tests only"
- name: "type: build"
  color: "d4c5f9"
  description: "Build, dependencies, package manifest"
- name: "type: ci"
  color: "fef2c0"
  description: "CI configuration only"
- name: "type: chore"
  color: "ededed"
  description: "Anything else not user-facing"

# --- issue and triage: applied by the templates or by triage ---
- name: "bug"
  color: "d73a4a"
  description: "Something behaves incorrectly"
- name: "feature"
  color: "0e8a16"
  description: "A capability that does not exist yet"
  aliases: ["enhancement"]
- name: "needs-triage"
  color: "fbca04"
  description: "Not yet assessed"
- name: "blocked"
  color: "000000"
  description: "Waiting on something outside this repository"
- name: "duplicate"
  color: "cfd3d7"
  description: "Already reported elsewhere"
- name: "wontfix"
  color: "ffffff"
  description: "Deliberately not pursued"
- name: "security"
  color: "b60205"
  description: "Security-relevant"
