name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The job MUST be named `ci` and the reusable workflow's last job `gate`: together
  # they publish the required check `ci / gate`. Pin an exact tag, never a moving alias.
  ci:
    uses: rak200/.github/.github/workflows/base.yml@1.8.0
    with:
      variant: none
