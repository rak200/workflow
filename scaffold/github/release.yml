name: release

# Cuts releases from master: release-please reads the commit history, opens and
# maintains a Release PR, and merging that PR cuts the bare tag and the GitHub
# Release. The version is derived here and typed nowhere.

on:
  push:
    branches: [master]

# The caller caps what the called workflow may request. release-please cuts the tag
# and the Release, and opens the Release PR, so it needs both — capped at read here,
# it would `startup_failure` and never publish anything to notice.
permissions:
  contents: write
  pull-requests: write

jobs:
  # Relative, like ci.yml in this variant, and NOT a pinned `rak200/.github/...@tag`.
  # The `github` variant is rak200/.github itself: an absolute self-reference can
  # never name a current tag, because the release it is part of has not been cut yet.
  # It sat at 1.8.0 while the repository released 1.9.1, and the pin-staleness check
  # found it on its own first run.
  release:
    uses: ./.github/workflows/release.yml
