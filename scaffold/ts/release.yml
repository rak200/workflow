name: release

# Cuts releases from master: release-please reads the commit history, opens and
# maintains a Release PR, and merging that PR cuts the bare tag and the GitHub
# Release. The version is derived here and typed nowhere.
#
# The TypeScript variant then PUBLISHES, in this same run. A tag and a Release
# created with the repository's own GITHUB_TOKEN start no new workflow, so an
# `on: release: published` job would never fire — the publish hangs off the release
# job's outputs instead. PHP has no equivalent job because Packagist resolves from
# the git tag: there the tag is already the publication.
#
# THIS FILENAME IS REGISTERED WITH NPM. Trusted publishing validates the caller
# workflow's filename, not the reusable one that runs `npm publish`, so the trusted
# publisher for the package names `release.yml`. Renaming this file breaks publishing
# with an authentication error that says nothing about the rename.

on:
  push:
    branches: [master]

# The caller caps what the called workflow may request. release-please cuts the tag
# and the Release, and opens the Release PR, so it needs both — capped at read here,
# it would `startup_failure` and never publish anything to notice. `id-token` is the
# publish credential and must be granted on both sides of the call.
permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    uses: rak200/.github/.github/workflows/release.yml@1.6.0

  publish:
    needs: release
    if: needs.release.outputs.release_created == 'true'
    permissions:
      contents: read
      id-token: write
    uses: rak200/.github/.github/workflows/npm-publish.yml@1.6.0
    with:
      tag: ${{ needs.release.outputs.tag_name }}
